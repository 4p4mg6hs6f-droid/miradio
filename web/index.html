<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>miradio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>miradio</h1>
    <p id="updated" class="muted">불러오는 중…</p>
  </header>

  <div id="status" role="status" hidden></div>

  <section id="settings" aria-label="재생 설정">
    <fieldset><legend>시간</legend><div class="chips" id="g-mins"></div></fieldset>
    <fieldset><legend>분야</legend><div class="chips" id="g-cat"></div></fieldset>
    <fieldset><legend>목소리</legend><div class="chips" id="g-voice"></div></fieldset>
    <button id="start" class="primary" disabled>재생 시작</button>
  </section>

  <section id="player" hidden aria-label="플레이어">
    <p class="remain"><span id="remain">0:00</span><small> 남음</small></p>
    <h2 id="title">-</h2>
    <p id="source" class="muted"></p>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
    <div class="times muted"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="controls">
      <button id="prev" aria-label="이전 기사">⏮</button>
      <button id="play" class="primary round" aria-label="재생/일시정지">▶</button>
      <button id="next" aria-label="다음 기사">⏭</button>
    </div>
    <label class="rate">속도
      <select id="rate">
        <option value="0.8">0.8×</option><option value="1">1×</option>
        <option value="1.2">1.2×</option><option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </label>
    <ol id="list"></ol>
  </section>

  <footer class="muted">
    기사 제목·요약은 각 언론사 RSS에서 가져와 AI가 낭독용으로 다시 쓴 것이며, 사실과 다를 수 있습니다.
    정확한 내용은 목록의 출처 링크에서 확인하세요. 음성은 합성음입니다. 개인·비상업 용도.
  </footer>
</main>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
