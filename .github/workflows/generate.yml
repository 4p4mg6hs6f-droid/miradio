name: generate-news-audio

on:
  schedule:                       # UTC 기준 → KST 06:00 / 12:00 / 18:00
    - cron: "0 21 * * *"
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      categories:
        description: "쉼표 구분 (politics,economy,society,it). 비우면 전체"
        required: false
        default: ""

permissions:
  contents: write                 # Releases 업로드 + gh-pages push

concurrency:
  group: news-audio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt

      # 이전 manifest를 유지하기 위해 gh-pages 브랜치를 site/ 로 가져온다(없으면 새로 init)
      - name: Prepare site (gh-pages)
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site && git -C site init -b gh-pages && git -C site remote add origin "$REMOTE"
          fi

      - name: Generate (RSS → Gemini → TTS → Releases → manifest)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          # 대체 제공자(선택): 등록한 것만 사용됨. 순서는 LLM_CHAIN
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || '' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || '' }}
          LLM_CHAIN: ${{ vars.LLM_CHAIN || 'gemini,groq,openrouter' }}
          GEMINI_INTERVAL_SEC: ${{ vars.GEMINI_INTERVAL_SEC || '8' }}
          AUDIO_STORE: ${{ vars.AUDIO_STORE || 'pages' }}
          PYTHONUNBUFFERED: "1"
          CATEGORIES_INPUT: ${{ github.event.inputs.categories }}
        run: python -m pipeline.main --categories "$CATEGORIES_INPUT"

      - name: Publish site to gh-pages
        run: |
          cp web/* site/ && touch site/.nojekyll
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd site
          # mp3가 git 히스토리에 쌓이지 않도록 매번 새 히스토리로 덮어쓴다(force push)
          rm -rf .git && git init -q -b gh-pages && git remote add origin "$REMOTE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "update $(date -u +%FT%TZ)"
          git push -f origin gh-pages

      # release 모드에서만 의미 있음: push 성공 후 manifest가 참조하지 않는 이전 에셋 삭제
      - name: Cleanup old release assets
        if: ${{ (vars.AUDIO_STORE || 'pages') == 'release' }}
        env:
          AUDIO_STORE: release
        run: python -m pipeline.main --cleanup
